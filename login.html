<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ Studio - تسجيل الدخول</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Card Header with Logo -->
      <div class="auth-card-header">
        <img src="./assets/az-studio-logo.svg" alt="AZ Studio - Audiovisual Production" />
      </div>

      <!-- Card Body -->
      <div class="auth-card-body">
        <h1 class="auth-title" style="justify-content: center; font-size: 18px; margin-bottom: 20px;">تسجيل الدخول</h1>

        <form class="auth-form" action="index.html" method="GET">
          <!-- Email Field -->
          <div class="auth-field-group">
            <label class="auth-label">البريد الإلكتروني</label>
            <div class="auth-input-wrap">
              <input type="email" class="auth-input auth-input-email" placeholder="example@azstudio.com" required autocomplete="email" />
              <div class="input-icon-left">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
              </div>
            </div>
          </div>

          <!-- Password Field -->
          <div class="auth-field-group">
            <label class="auth-label">كلمة المرور</label>
            <div class="auth-input-wrap">
              <input type="password" class="auth-input auth-input-password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" />
              <!-- Lock Icon on Right -->
              <div class="input-icon-right">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </div>
              <!-- Eye Toggle on Left -->
              <button type="button" class="btn-toggle-eye" id="toggleLoginPass" aria-label="إظهار / إخفاء كلمة المرور">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit">
            <span>دخول</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          </button>
        </form>

        <p class="auth-footer-text">للحصول على صلاحيات الدخول، تواصل مع المسؤول</p>
      </div>
    </div>
  </div>

  <script>
    const passInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('toggleLoginPass');
    if (passInput && toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
      });
    }
  </script>
</body>
</html>
