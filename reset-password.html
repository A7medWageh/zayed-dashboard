<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ Studio - تعيين كلمة المرور الجديدة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Card Header with Logo -->
      <div class="auth-card-header">
        <img src="./assets/az-studio-logo.svg" alt="AZ Studio - Audiovisual Production" />
      </div>

      <!-- Card Body -->
      <div class="auth-card-body">
        <h1 class="auth-title">استرجاع كلمة المرور 🔐</h1>
        <p class="auth-subtitle">يجب أن تكون كلمة المرور الجديدة قوية، يفضل استخدام (* - # - &)</p>

        <form class="auth-form" id="newPasswordForm" action="login.html" method="GET">
          <!-- New Password Field -->
          <div class="auth-field-group">
            <label class="auth-label">كلمة المرور الجديدة</label>
            <div class="auth-input-wrap">
              <input type="password" class="auth-input auth-input-password" id="newPassInput" placeholder="••••••••" required autocomplete="new-password" />
              <div class="input-icon-right">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </div>
              <button type="button" class="btn-toggle-eye" id="toggleNewPass" aria-label="إظهار / إخفاء">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="auth-field-group">
            <label class="auth-label">تأكيد كلمة المرور الجديدة</label>
            <div class="auth-input-wrap">
              <input type="password" class="auth-input auth-input-password" id="confirmPassInput" placeholder="••••••••" required autocomplete="new-password" />
              <div class="input-icon-right">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </div>
              <button type="button" class="btn-toggle-eye" id="toggleConfirmPass" aria-label="إظهار / إخفاء">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-submit">
            <span>تعيين كلمة مرور جديدة</span>
          </button>
        </form>

        <a href="login.html" class="auth-footer-link">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          <span>العودة للتسجيل</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    function setupToggle(inputEl, btnEl) {
      if (inputEl && btnEl) {
        btnEl.addEventListener('click', () => {
          const isPass = inputEl.type === 'password';
          inputEl.type = isPass ? 'text' : 'password';
        });
      }
    }
    setupToggle(document.getElementById('newPassInput'), document.getElementById('toggleNewPass'));
    setupToggle(document.getElementById('confirmPassInput'), document.getElementById('toggleConfirmPass'));

    const form = document.getElementById('newPasswordForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        const p1 = document.getElementById('newPassInput').value;
        const p2 = document.getElementById('confirmPassInput').value;
        if (p1 !== p2) {
          e.preventDefault();
          alert('كلمتا المرور غير متطابقتين!');
        }
      });
    }
  </script>
</body>
</html>
