<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="أعد تعيين كلمة المرور الخاصة بك عبر رابط إعادة التعيين المُرسل إلى بريدك الإلكتروني."
    />
    <title>AZ Studio - إعادة تعيين كلمة المرور</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="auth-card">
        <!-- Card Header with Logo -->
        <div class="auth-card-header">
          <img
            src="./assets/az-studio-logo.svg"
            alt="AZ Studio - Audiovisual Production"
            width="160"
            height="45"
          />
        </div>

        <!-- Card Body -->
        <div class="auth-card-body">
          <h1 class="auth-title">إعادة تعيين كلمة المرور 🔐</h1>
          <p class="auth-subtitle">أدخل كلمة المرور الجديدة وتأكيدها لإتمام عملية إعادة التعيين</p>

          <form class="auth-form" id="resetPasswordForm" novalidate>
            <!-- New Password Field -->
            <div class="auth-field-group">
              <label class="auth-label" for="newPassInput">كلمة المرور الجديدة</label>
              <div class="auth-input-wrap">
                <input
                  type="password"
                  class="auth-input auth-input-password"
                  id="newPassInput"
                  name="newPassword"
                  placeholder="••••••••"
                  required
                  autocomplete="new-password"
                  aria-required="true"
                  aria-describedby="newPassHint"
                />
                <div class="input-icon-right" aria-hidden="true">
                  <i data-lucide="lock"></i>
                </div>
                <button
                  type="button"
                  class="btn-toggle-eye"
                  id="toggleNewPass"
                  aria-label="إظهار / إخفاء كلمة المرور"
                >
                  <i data-lucide="eye"></i>
                </button>
              </div>
              <span id="newPassHint" class="auth-field-hint">يجب أن تكون 6 خانات أو أكثر</span>
            </div>

            <!-- Confirm Password Field -->
            <div class="auth-field-group">
              <label class="auth-label" for="confirmPassInput">تأكيد كلمة المرور الجديدة</label>
              <div class="auth-input-wrap">
                <input
                  type="password"
                  class="auth-input auth-input-password"
                  id="confirmPassInput"
                  name="confirmPassword"
                  placeholder="••••••••"
                  required
                  autocomplete="new-password"
                  aria-required="true"
                  aria-describedby="confirmPassError"
                />
                <div class="input-icon-right" aria-hidden="true">
                  <i data-lucide="lock"></i>
                </div>
                <button
                  type="button"
                  class="btn-toggle-eye"
                  id="toggleConfirmPass"
                  aria-label="إظهار / إخفاء كلمة المرور"
                >
                  <i data-lucide="eye"></i>
                </button>
              </div>
              <span
                id="confirmPassError"
                class="auth-field-error"
                role="alert"
                aria-live="polite"
              ></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit" id="resetPasswordSubmitBtn">
              <span>تعيين كلمة مرور جديدة</span>
            </button>
          </form>

          <a href="login.html" class="auth-back-link">
            <i data-lucide="arrow-right" style="width: 14px; height: 14px"></i>
            <span>العودة لتسجيل الدخول</span>
          </a>
        </div>
      </div>
    </div>

    <div id="toastContainer" role="region" aria-live="polite" aria-label="إشعارات النظام"></div>

    <script src="./js/lucide.min.js"></script>
    <script type="module" src="./js/auth.js"></script>
  </body>
</html>
