<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ Studio - استرجاع كلمة المرور</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <!-- Card Header with Logo -->
      <div class="auth-card-header">
        <img src="./assets/az-studio-logo.svg" alt="AZ Studio - Audiovisual Production" width="160" height="45" />
      </div>

      <!-- Card Body -->
      <div class="auth-card-body">
        <h1 class="auth-title">استرجاع كلمة المرور 🔑</h1>
        <p class="auth-subtitle">أدخل بريدك وسنرسل إليك رمز التحقق المكون من 6 أرقام</p>

        <form class="auth-form" id="enterEmailForm" novalidate>
          <!-- Email Field -->
          <div class="auth-field-group">
            <label class="auth-label" for="resetEmail">البريد الإلكتروني</label>
            <div class="auth-input-wrap">
              <input 
                type="email" 
                id="resetEmail" 
                name="email"
                class="auth-input auth-input-email" 
                placeholder="example@azstudio.com" 
                required 
                autocomplete="email"
                aria-required="true"
              />
              <div class="input-icon-left" aria-hidden="true">
                <i data-lucide="mail"></i>
              </div>
            </div>
          </div>

          <!-- Continue Button -->
          <button type="submit" class="btn-auth-submit">
            <span>استمرار</span>
          </button>
        </form>

        <a href="login.html" class="auth-footer-link" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; color: var(--text-muted); text-decoration: none; font-size: var(--font-size-xs);">
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
          <span>العودة لتسجيل الدخول</span>
        </a>
      </div>
    </div>
  </div>

  <div id="toastContainer" role="region" aria-live="polite" aria-label="إشعارات النظام"></div>

  <script src="./js/lucide.min.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
